<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قياس التشابه الدلالي – Pollinations</title>
<style>
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0d0b10; color:#e8e2d8; font-family: system-ui, sans-serif;
    padding: 24px;
  }
  .card {
    background:#17141b; border:1px solid #3a2f26; border-radius:12px;
    padding:2rem; width:100%; max-width:420px; text-align:center;
  }
  h1 { font-size:1.3rem; margin-bottom:0.5rem; color:#c9a24b; }
  p { color:#a89f95; font-size:0.9rem; }
  button, a.btn {
    display:inline-block; width:100%; box-sizing:border-box;
    margin-top:1rem; padding:0.8rem 1.5rem;
    background:#8b1e2b; color:#fff; border:none; border-radius:8px;
    font-size:1rem; cursor:pointer; text-decoration:none;
  }
  button:hover, a.btn:hover { background:#a5222f; }
  button.secondary { background:#3a2f26; }
  button.secondary:hover { background:#4a3c30; }
  textarea {
    width:100%; padding:0.75rem 0.9rem; border-radius:8px; border:1px solid #3a2f26;
    background:#0d0b10; color:#e8e2d8; font-family:inherit; font-size:0.9rem;
    margin-top:0.8rem; box-sizing:border-box; text-align:right; resize:vertical;
  }
  #error-box { color:#e07a7a; font-size:0.85rem; margin-top:1rem; display:none; }
  #result { margin-top:1.2rem; font-size:1.4rem; color:#c9a24b; font-weight:600; }
  #status { color:#a89f95; font-size:0.85rem; margin-top:0.8rem; }
</style>
</head>
<body>
  <div class="card">
    <div id="login-screen">
      <h1>تسجيل الدخول</h1>
      <p>سجّل دخولك عبر حساب Pollinations لاستخدام رصيدك الخاص (Pollen).</p>
      <button id="login-btn">تسجيل الدخول عبر Pollinations</button>
    </div>

    <div id="logged-in-screen" style="display:none">
      <h1>قياس التشابه الدلالي</h1>
      <p>اكتب نصين وسنقيس مدى تقارب معناهما باستخدام رصيدك الخاص من Pollen.</p>
      <textarea id="textA" rows="2" placeholder="النص الأول..."></textarea>
      <textarea id="textB" rows="2" placeholder="النص الثاني..."></textarea>
      <button id="compareBtn">قارن التشابه</button>
      <div id="result"></div>
      <div id="status"></div>
      <button class="secondary" id="logout-btn">تسجيل الخروج</button>
    </div>

    <div id="error-box"></div>
  </div>

<script>
// ضع هنا App Key جديد (pk_...) مسجّل برابط هذا المستودع تحديدًا
const APP_KEY = "pk_8iT8d7XxcwkB4lEQ";
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPE = "openid profile";

function base64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function sha256(str) {
  return await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
}
function randomString(len = 64) {
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return base64url(arr.buffer);
}
async function discoverEndpoints() {
  const res = await fetch('https://enter.pollinations.ai/.well-known/oauth-authorization-server');
  if (!res.ok) throw new Error('تعذر جلب إعدادات المصادقة من Pollinations');
  return res.json();
}
function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg;
  box.style.display = 'block';
}
function showLoggedIn() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('logged-in-screen').style.display = 'block';
}

async function startLogin() {
  try {
    const meta = await discoverEndpoints();
    const codeVerifier = randomString(64);
    const codeChallenge = base64url(await sha256(codeVerifier));
    const state = randomString(24);

    sessionStorage.setItem('pkce_verifier', codeVerifier);
    sessionStorage.setItem('oauth_state', state);

    const url = new URL(meta.authorization_endpoint);
    url.searchParams.set('response_type', 'code');
    url.searchParams.set('client_id', APP_KEY);
    url.searchParams.set('redirect_uri', REDIRECT_URI);
    url.searchParams.set('state', state);
    url.searchParams.set('code_challenge', codeChallenge);
    url.searchParams.set('code_challenge_method', 'S256');
    url.searchParams.set('scope', SCOPE);
    window.location.href = url.toString();
  } catch (e) {
    showError(e.message);
  }
}

async function handleCallback(code, state) {
  const savedState = sessionStorage.getItem('oauth_state');
  const verifier = sessionStorage.getItem('pkce_verifier');
  if (!verifier || state !== savedState) {
    showError('فشل التحقق من الجلسة (state mismatch). حاول تسجيل الدخول من جديد.');
    return;
  }
  try {
    const meta = await discoverEndpoints();
    const body = new URLSearchParams({
      grant_type: 'authorization_code',
      code,
      redirect_uri: REDIRECT_URI,
      client_id: APP_KEY,
      code_verifier: verifier
    });
    const res = await fetch(meta.token_endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    });
    if (!res.ok) throw new Error('فشل تبادل رمز التفويض بالمفتاح');
    const data = await res.json();
    localStorage.setItem('pollinations_api_key', data.access_token);
    sessionStorage.removeItem('pkce_verifier');
    sessionStorage.removeItem('oauth_state');
    window.history.replaceState({}, document.title, REDIRECT_URI);
    showLoggedIn();
  } catch (e) {
    showError(e.message);
  }
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function cosineSimilarity(a, b) {
  let dot = 0, normA = 0, normB = 0;
  for (let i = 0; i < a.length; i++) {
    dot += a[i] * b[i];
    normA += a[i] * a[i];
    normB += b[i] * b[i];
  }
  return dot / (Math.sqrt(normA) * Math.sqrt(normB));
}

async function compareTexts() {
  const key = localStorage.getItem('pollinations_api_key');
  const a = document.getElementById('textA').value.trim();
  const b = document.getElementById('textB').value.trim();
  const resultBox = document.getElementById('result');
  resultBox.textContent = '';

  if (!a || !b) { setStatus('اكتب النصين الاثنين أولاً.'); return; }

  setStatus('جارِ القياس...');

  try {
    const res = await fetch('https://gen.pollinations.ai/v1/embeddings', {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${key}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ model: 'openai-3-small', input: [a, b] })
    });
    if (!res.ok) {
      let detail = '';
      try { detail = JSON.stringify(await res.json()); }
      catch { detail = await res.text(); }
      throw new Error(`HTTP ${res.status} — ${detail}`);
    }
    const data = await res.json();
    const sim = cosineSimilarity(data.data[0].embedding, data.data[1].embedding);
    resultBox.textContent = `نسبة التشابه: ${(sim * 100).toFixed(1)}%`;
    setStatus('');
  } catch (err) {
    setStatus('تعذّر القياس: ' + err.message);
  }
}

document.getElementById('login-btn').addEventListener('click', startLogin);
document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('pollinations_api_key');
  location.reload();
});
document.getElementById('compareBtn')?.addEventListener('click', compareTexts);

(function init() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  if (code && state) {
    handleCallback(code, state);
  } else if (localStorage.getItem('pollinations_api_key')) {
    showLoggedIn();
  }
})();
</script>
</body>
</html>
